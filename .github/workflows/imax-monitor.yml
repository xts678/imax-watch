name: IMAX 预售监测

# 放到新仓库的 .github/workflows/imax-monitor.yml
# 每 10 分钟跑一轮；只有"开售了"才推送，平时不打扰。

on:
  schedule:
    - cron: "*/5 * * * *"       # GitHub 允许的最短间隔；实际触发会被节流
  workflow_dispatch:            # 支持手动点一下跑一轮
    inputs:
      test_notify:
        description: "只发一条测试推送，不扫描"
        type: boolean
        default: false

permissions:
  contents: write               # 需要写回去重状态 state.json

concurrency:
  group: imax-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 连通性自检（猫眼能不能访问）
        if: ${{ inputs.test_notify != true }}
        run: python imax_presale_monitor.py --preflight

      - name: 测试推送（只在手动勾选时执行）
        if: ${{ inputs.test_notify == true }}
        env:
          IMAX_CLOUD: "1"
          IMAX_BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python imax_presale_monitor.py --test-notify

      - name: 扫描（命中才推送）
        if: ${{ inputs.test_notify != true }}
        env:
          IMAX_CLOUD: "1"
          IMAX_BARK_KEY: ${{ secrets.BARK_KEY }}
          IMAX_PREFERRED: "37816,36884,40502,16229"
          IMAX_HEARTBEAT_HOURS: "0"
        run: python imax_presale_monitor.py --once

      - name: 保存去重状态（有变化才提交）
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json 2>/dev/null)" ]; then
            git config user.name "imax-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: 更新开售去重状态 [skip ci]"
            git push
            echo "已提交 state.json"
          else
            echo "状态无变化，不提交"
          fi
